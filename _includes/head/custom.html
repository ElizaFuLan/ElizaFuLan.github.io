{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0d1316" media="(prefers-color-scheme: dark)"/>
<meta name="color-scheme" content="light dark"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- The two faces every page paints above the fold -->
<link rel="preload" href="{{ base_path }}/assets/fonts/ibm-plex-sans-var.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="{{ base_path }}/assets/fonts/newsreader-var.woff2" as="font" type="font/woff2" crossorigin/>

<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Site motion lives in its own file: compress_html collapses this include
     to one line, which is what broke the old inline script. -->
<script defer src="{{ base_path }}/assets/js/site-motion.js?v={{ site.time | date: '%s' }}"></script>
<script defer src="{{ base_path }}/assets/js/pixel-miku.js?v={{ site.time | date: '%s' }}"></script>
<script defer src="{{ base_path }}/assets/js/verify-loop.js?v={{ site.time | date: '%s' }}"></script>
<script defer src="{{ base_path }}/assets/js/token-flow.js?v={{ site.time | date: '%s' }}"></script>

<!-- end custom head snippets -->
