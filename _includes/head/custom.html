<!-- Reveal elements as they scroll into view.
     NOTE: compress_html collapses this file to a single line, so this script
     must never use // line comments — they would swallow the rest of the code. -->
<script>
  /* Purely additive: this only ADDS an entrance animation to already-visible
     content. If any of it fails, the page still renders in full. */
  document.addEventListener("DOMContentLoaded", function () {
    if (!("IntersectionObserver" in window)) { return; }

    var items = document.querySelectorAll(".reveal");
    if (!items.length) { return; }

    try {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) { return; }
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });

      for (var i = 0; i < items.length; i++) {
        items[i].style.animationDelay = Math.min(i * 60, 240) + "ms";
        observer.observe(items[i]);
      }
    } catch (e) { /* no animation, content unaffected */ }
  });
</script>
