<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Reveal elements as they scroll into view.
     NOTE: compress_html collapses this file to a single line, so this script
     must never use // line comments — they would swallow the rest of the code. -->
<script>
  /* Opt into the hidden-until-revealed state only when JS is running, so a
     broken script can cost the animation but never the content itself. */
  document.documentElement.className += " js-reveal";

  document.addEventListener("DOMContentLoaded", function () {
    var items = document.querySelectorAll(".reveal");
    if (!items.length) { return; }

    function showAll() {
      for (var i = 0; i < items.length; i++) {
        items[i].classList.add("is-visible");
      }
    }

    var reduced = window.matchMedia
      && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* Motion turned off, or no observer support: just show everything. */
    if (reduced || !("IntersectionObserver" in window)) { showAll(); return; }

    try {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) { return; }
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });

      for (var j = 0; j < items.length; j++) {
        items[j].style.transitionDelay = Math.min(j * 60, 240) + "ms";
        observer.observe(items[j]);
      }

      /* Safety net: nothing should stay hidden for longer than this. */
      window.setTimeout(showAll, 2500);
    } catch (e) {
      showAll();
    }
  });
</script>

<!-- end custom head snippets -->
